services:
  db:
    image: postgres:16-alpine
    container_name: glammy-studio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: glammy
      POSTGRES_PASSWORD: glammy
      POSTGRES_DB: glammy_studio
    ports:
      - "5432:5432"
    volumes:
      - glammy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glammy -d glammy_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  glammy_pgdata:
